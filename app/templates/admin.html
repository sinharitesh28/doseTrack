<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Admin Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn-danger { background: #e74c3c; color: white; padding: 5px 10px; border: none; border-radius: 3px; cursor: pointer; }
        .navbar { display: flex; justify-content: space-between; align-items: center; background: #34495e; padding: 15px; color: white; border-radius: 5px; margin-bottom: 20px;}
        .navbar a { color: white; text-decoration: none; font-weight: bold; margin-left: 15px;}
    </style>
</head>
<body>
    <div class="container">
        <div class="navbar">
            <span>DoseTrack Admin</span>
            <div>
                <a href="/">Dashboard</a>
                <a href="/logout">Logout</a>
            </div>
        </div>

        <h2>Registered Users Directory</h2>
        <table>
            <thead>
                <tr>
                    <th>Telegram ID</th>
                    <th>First Name</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr id="row-{{ user.telegram_id }}">
                    <td>{{ user.telegram_id }}</td>
                    <td>{{ user.first_name }}</td>
                    <td>{{ user.role }}</td>
                    <td>
                        <span style="color: {{ 'green' if user.status == 'Active' else 'red' }}">{{ user.status }}</span>
                    </td>
                    <td>
                        {% if user.role != 'Admin' and user.status == 'Active' %}
                        <button class="btn-danger" onclick="removeUser('{{ user.telegram_id }}')">Remove Access</button>
                        {% endif %}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <script>
        async function removeUser(telegram_id) {
            if (confirm("Are you sure you want to revoke this user's access? They will be logged out immediately.")) {
                const res = await fetch(`/api/admin/remove/${telegram_id}`, { method: 'POST' });
                if (res.ok) {
                    alert("User access revoked.");
                    location.reload();
                } else {
                    alert("Failed to remove user.");
                }
            }
        }
    </script>
</body>
</html>
