<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>DoseTrack Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-box { max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 8px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #qrCodeImg { margin: 20px auto; display: none; }
        .spinner { margin: 20px auto; display: none; width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>DoseTrack Staff</h1>
        <p id="msg">Generating Secure QR Code...</p>
        <img id="qrCodeImg" src="" alt="Login QR Code">
        <a id="telegramLink" href="#" target="_blank" class="btn-submit hidden" style="display:inline-block; text-decoration:none;">Open in Telegram</a>
        <div class="spinner" id="spinner"></div>
    </div>

    <script>
        async function initLogin() {
            try {
                const res = await fetch('/api/auth/token');
                const data = await res.json();

                document.getElementById('qrCodeImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(data.link)}`;
                document.getElementById('qrCodeImg').style.display = 'block';
                document.getElementById('telegramLink').href = data.link;
                document.getElementById('telegramLink').classList.remove('hidden');
                document.getElementById('msg').innerText = "Scan to Login or Request Access";

                pollStatus(data.token);
            } catch (e) {
                document.getElementById('msg').innerText = "Error generating login code.";
            }
        }

        function pollStatus(token) {
            const interval = setInterval(async () => {
                const res = await fetch(`/api/auth/status/${token}?t=${new Date().getTime()}`);
                const data = await res.json();

                if (data.status === 'WaitingForAdmin') {
                    document.getElementById('msg').innerText = "⏳ Please wait for Admin approval...";
                    document.getElementById('qrCodeImg').style.display = 'none';
                    document.getElementById('telegramLink').style.display = 'none';
                    document.getElementById('spinner').style.display = 'block';
                } else if (data.status === 'Approved') {
                    clearInterval(interval);
                    window.location.href = '/';
                } else if (data.status === 'Denied') {
                    clearInterval(interval);
                    document.getElementById('msg').innerText = "❌ Access Denied by Admin.";
                    document.getElementById('msg').style.color = 'red';
                    document.getElementById('spinner').style.display = 'none';
                }
            }, 2000);
        }

        window.onload = initLogin;
    </script>
</body>
</html>
