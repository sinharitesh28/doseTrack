name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
      - master # Triggers on push to either branch name

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: dosetrack-app
  REGION: asia-south1 # Mumbai region (closest to your Vadodara location)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          source: ./
          flags: |
            --allow-unauthenticated

      - name: Show Output URL
        run: echo "Deployed URL - ${{ steps.deploy.outputs.url }}"
